name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  host-smoke:
    runs-on: ubuntu-latest
    env:
      EV_REPO_MODE: PRIVATE_REPO
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate SDK target matrix metadata
        run: ./tools/fw sdk-matrix-check

      - name: Generate static route table artifacts
        run: ./tools/fw routegen

      - name: Generate living documentation artifacts
        run: ./tools/fw docgen

      - name: Verify generated artifacts are checked in
        run: make secret-safe-working-tree-clean-gate

      - name: Run host release gate
        run: ./tools/fw release-gate

      - name: Verify release gate left the tree clean
        run: make secret-safe-working-tree-clean-gate

  sdk-target-smoke:
    runs-on: ubuntu-latest
    env:
      EV_REPO_MODE: PRIVATE_REPO
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate pinned SDK toolchain contract
        run: ./tools/fw sdk-check

      - name: Materialize generic target sdkconfig from defaults
        run: ./tools/fw sdk-defconfig

      - name: Build generic ESP8266 golden-reference target
        run: |
          set -o pipefail
          mkdir -p build
          ./tools/fw sdk-build-one esp8266_generic_dev 2>&1 | tee build/sdk-current.log
          python3 tools/audit/sdk_warning_policy.py --project-only --latest-build-session --session-kind build --strict-build-session --target esp8266_generic_dev build/sdk-current.log

      - name: Clean generic target build outputs
        run: ./tools/fw sdk-clean-target

      - name: Distclean generic target wrapper state
        run: ./tools/fw sdk-distclean

      - name: Rebuild generic target after distclean
        run: |
          set -o pipefail
          mkdir -p build
          ./tools/fw sdk-build-one esp8266_generic_dev 2>&1 | tee build/sdk-current-rebuild.log
          python3 tools/audit/sdk_warning_policy.py --project-only --latest-build-session --session-kind build --strict-build-session --target esp8266_generic_dev build/sdk-current-rebuild.log

  sdk-atnel-target-smoke:
    runs-on: ubuntu-latest
    env:
      EV_REPO_MODE: PRIVATE_REPO
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Materialize ATNEL target sdkconfig from defaults
        env:
          FW_SDK_PROJECT_DIR: adapters/esp8266_rtos_sdk/targets/atnel_air_esp_motherboard
        run: ./tools/fw sdk-defconfig

      - name: Build ATNEL target
        env:
          FW_SDK_PROJECT_DIR: adapters/esp8266_rtos_sdk/targets/atnel_air_esp_motherboard
        run: |
          set -o pipefail
          mkdir -p build
          ./tools/fw sdk-build-one atnel_air_esp_motherboard 2>&1 | tee build/sdk-atnel-current.log
          python3 tools/audit/sdk_warning_policy.py --project-only --latest-build-session --session-kind build --strict-build-session --target atnel_air_esp_motherboard build/sdk-atnel-current.log

      - name: Clean ATNEL target build outputs
        env:
          FW_SDK_PROJECT_DIR: adapters/esp8266_rtos_sdk/targets/atnel_air_esp_motherboard
        run: ./tools/fw sdk-clean-target

      - name: Distclean ATNEL target wrapper state
        env:
          FW_SDK_PROJECT_DIR: adapters/esp8266_rtos_sdk/targets/atnel_air_esp_motherboard
        run: ./tools/fw sdk-distclean

      - name: Rebuild ATNEL target after distclean
        env:
          FW_SDK_PROJECT_DIR: adapters/esp8266_rtos_sdk/targets/atnel_air_esp_motherboard
        run: |
          set -o pipefail
          mkdir -p build
          ./tools/fw sdk-build-one atnel_air_esp_motherboard 2>&1 | tee build/sdk-atnel-current-rebuild.log
          python3 tools/audit/sdk_warning_policy.py --project-only --latest-build-session --session-kind build --strict-build-session --target atnel_air_esp_motherboard build/sdk-atnel-current-rebuild.log
